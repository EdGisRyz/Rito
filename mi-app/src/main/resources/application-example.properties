spring.application.name=mi-app

# ===============================
# Conexión a PostgreSQL
# ===============================

# Cambia localhost si tu base de datos está en otro servidor
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/MVPClinica}

# Usuario de PostgreSQL
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:TU_USUARIO_AQUI}

# Contraseña de PostgreSQL
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:TU_PASSWORD_AQUI}

spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
logging.level.org.flywaydb=DEBUG

# ===============================
# JWT (Migración Sprint 1: HS256 → RS256)
# ===============================

# 1. Se mantiene SOLO para tests antiguos
# El nuevo código NO la usará, pero los tests existentes podrían fallar sin ella
# Clave secreta JWT (mínimo 256 bits o en Base64)
jwt.secret=${JWT_SECRET:CLAVE_SECRETA_TEMPORAL_PARA_TESTS_123456}

# 2. Clave pública RSA (RS256) — LA IMPORTANTE AHORA
#    El AuthService de InToGlobe genera tokens con su private key
#    El backend valida esos tokens con la public key
#    Formato: PEM con saltos de línea escapados (\n)
auth.public.key=${AUTH_PUBLIC_KEY:-----BEGIN PUBLIC KEY-----\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA...\n-----END PUBLIC KEY-----}

# Tiempo de expiración del token (24 horas)
jwt.expiration=86400000
# ===============================
# FastAPI
# ===============================

# URL del microservicio FastAPI
fastapi.url=${FASTAPI_URL:http://localhost:8001}

# ===============================
# Circuit Breaker — FastAPI IA
# ===============================

resilience4j.circuitbreaker.instances.fastapi-ia.sliding-window-size=5
resilience4j.circuitbreaker.instances.fastapi-ia.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.fastapi-ia.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.fastapi-ia.permitted-number-of-calls-in-half-open-state=2
